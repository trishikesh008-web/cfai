<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<canvas id="chart"></canvas>

<script>

const ctx = document.getElementById('chart');

new Chart(ctx, {

    type: 'bar',

    data: {

        labels: [
            'Dijkstra',
            'Bellman-Ford'
        ],

        datasets: [{

            label: 'Execution Time',

            data: [
                {{ result.dijkstra_time }},
                {{ result.bellman_time }}
            ]
        }]
    }
});

</script>
